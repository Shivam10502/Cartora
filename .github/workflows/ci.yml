name: Cartora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cartora_test
          POSTGRES_USER: cartora
          POSTGRES_PASSWORD: cartora-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cartora -d cartora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:postgresql://localhost:5432/cartora_test
      DB_USERNAME: cartora
      DB_PASSWORD: cartora-ci-password
      JWT_SECRET: CartoraCiSecretMustHaveMoreThanThirtyTwoBytes!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run backend tests
        run: ./mvnw -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend
